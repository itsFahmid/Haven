services:
  - type: web
    name: obhoy-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: obhoy-database
          property: connectionString

databases:
  - name: obhoy-database
    plan: free
    region: oregon
    databaseName: obhoy_db
    user: obhoy_user
