services:
  - type: web
    name: haven-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: haven-database
          property: connectionString

databases:
  - name: haven-database
    plan: free
    region: oregon
    databaseName: haven_db
    user: haven_user
